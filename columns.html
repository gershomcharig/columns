<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Columns</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      min-width: 1200px;
      height: 100vh;
    }

    .column {
      padding: 24px;
      overflow-y: auto;
      height: 100vh;
      border-right: 1px solid #e5e5e5;
    }

    .column:last-child {
      border-right: none;
    }

    .column h2 {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
      margin-bottom: 16px;
    }

    .column ol {
      padding-left: 24px;
    }

    .column li {
      margin-bottom: 12px;
    }

    .column li a {
      color: #1a6be0;
      text-decoration: none;
    }

    .column li a:hover {
      text-decoration: underline;
    }

    .column li .description {
      display: block;
      font-size: 13px;
      color: #666;
      margin-top: 2px;
    }

    .status {
      color: #999;
      font-size: 14px;
    }

    .status.error {
      color: #c0392b;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="column">
      <h2>Hacker News</h2>
      <div id="hn"><span class="status">Loading&hellip;</span></div>
    </div>
    <div class="column">
      <h2>TechCrunch</h2>
      <div id="tc"><span class="status">Loading&hellip;</span></div>
    </div>
    <div class="column">
      <h2>Product Hunt</h2>
      <div id="ph"><span class="status">Loading&hellip;</span></div>
    </div>
  </div>

  <script>
    const CORS_PROXY = 'https://api.allorigins.win/raw?url=';
    const FETCH_TIMEOUT_MS = 10000;
    const MAX_ITEMS = 30;

    function fetchWithTimeout(url) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
      return fetch(url, { signal: controller.signal })
        .finally(() => clearTimeout(timeout));
    }

    function renderList(container, items) {
      const ol = document.createElement('ol');
      for (const item of items) {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = item.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = item.title;
        li.appendChild(a);
        if (item.description) {
          const desc = document.createElement('span');
          desc.className = 'description';
          desc.textContent = item.description;
          li.appendChild(desc);
        }
        ol.appendChild(li);
      }
      container.innerHTML = '';
      container.appendChild(ol);
    }

    function renderError(container, sourceName) {
      container.innerHTML = `<span class="status error">Failed to load ${sourceName}</span>`;
    }

    async function loadHackerNews() {
      const container = document.getElementById('hn');
      try {
        const response = await fetchWithTimeout('https://hacker-news.firebaseio.com/v0/topstories.json');
        const ids = await response.json();
        const topIds = ids.slice(0, MAX_ITEMS);
        const items = await Promise.all(
          topIds.map(id =>
            fetchWithTimeout(`https://hacker-news.firebaseio.com/v0/item/${id}.json`)
              .then(r => r.json())
          )
        );
        const parsed = items.map(item => ({
          title: item.title,
          url: item.url || `https://news.ycombinator.com/item?id=${item.id}`,
        }));
        renderList(container, parsed);
      } catch {
        renderError(container, 'Hacker News');
      }
    }

    function parseRss(xml) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xml, 'text/xml');
      const items = doc.querySelectorAll('item');
      const results = [];
      for (let i = 0; i < Math.min(items.length, MAX_ITEMS); i++) {
        const item = items[i];
        const title = item.querySelector('title')?.textContent || '';
        const link = item.querySelector('link')?.textContent || '';
        const descriptionRaw = item.querySelector('description')?.textContent || '';
        const description = descriptionRaw.replace(/<[^>]*>/g, '').trim();
        results.push({
          title,
          url: link,
          description: description || null,
        });
      }
      return results;
    }

    async function loadRssFeed(containerId, feedUrl, sourceName) {
      const container = document.getElementById(containerId);
      try {
        const response = await fetchWithTimeout(CORS_PROXY + encodeURIComponent(feedUrl));
        const xml = await response.text();
        const items = parseRss(xml);
        renderList(container, items);
      } catch {
        renderError(container, sourceName);
      }
    }

    loadHackerNews();
    loadRssFeed('tc', 'https://techcrunch.com/feed/', 'TechCrunch');
    loadRssFeed('ph', 'https://www.producthunt.com/feed', 'Product Hunt');
  </script>
</body>
</html>
